name: Generate Pac-Man contribution graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checkout Pac-Man generator
        uses: actions/checkout@v4
        with:
          repository: gregkozakiewicz/pacman-contribution-graph
          path: pacman-generator

      - name: Install dependencies
        working-directory: pacman-generator
        run: npm ci

      - name: Generate Pac-Man
        working-directory: pacman-generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node src/generate.mjs \
            --user ${{ github.repository_owner }} \
            --out ../dist

      - name: Publish output
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
